<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCal</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header>
    <img src="icons/icon128.png" alt="MyCal">
    <div>
      <h1>MyCal</h1>
      <p>Your Canvas planning companion</p>
    </div>
  </header>

  <main>
    <div class="section-label">ACCOUNT</div>

    <section class="account-card">
      <div class="account-heading">
        <span id="statusDot" class="status-dot"></span>
        <strong id="accountTitle">Loading account...</strong>
      </div>

      <p id="accountEmail" hidden></p>
      <p id="accountDescription">
        Checking your MyCal session.
      </p>
    </section>

    <div id="guestActions" hidden>
      <button id="connectGoogle" class="primary">
        Connect Google account
      </button>

      <button id="signInGoogle" class="secondary">
        Already connected? Sign in
      </button>
    </div>

    <div id="connectedActions" hidden>
      <button id="signOut" class="signout-button">
        Sign out
      </button>
    </div>
    <p id="statusMessage" role="status" aria-live="polite"></p>

    <button id="openCalendar" class="calendar-button">
      Open Canvas Calendar
    </button>
  </main>

  <footer>
    MyCal · Your calendar, your way.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
